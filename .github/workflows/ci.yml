name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test calendar and layout
        run: dotnet test tests/CourtTimeline.WinUI.Tests/CourtTimeline.WinUI.Tests.csproj -c Release --nologo
      - name: Build library
        run: dotnet build src/CourtTimeline.WinUI/CourtTimeline.WinUI.csproj -c Release --nologo
      - name: Pack library
        run: dotnet pack src/CourtTimeline.WinUI/CourtTimeline.WinUI.csproj -c Release --no-build -o artifacts --nologo
      - name: Verify package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = [IO.Compression.ZipFile]::OpenRead((Get-Item artifacts/CourtTimeline.WinUI.0.1.0.nupkg).FullName)
          try {
            $entries = $package.Entries.FullName
            if (!($entries -match '^lib/.*/CourtTimeline.WinUI.dll$')) { throw 'Library assembly is missing' }
            if (!($entries -contains 'README.md') -or !($entries -contains 'LICENSE')) { throw 'Package documentation is missing' }
            if ($entries -match 'court-timeline.json|LawMatic|Kalends') { throw 'Application data leaked into the package' }
          } finally { $package.Dispose() }
      - name: Build sample with project reference
        run: dotnet build samples/CourtTimeline.WinUI.Sample/CourtTimeline.WinUI.Sample.csproj -c Release -p:Platform=x64 --nologo
      - name: Build sample from packed NuGet
        shell: pwsh
        run: dotnet build samples/CourtTimeline.WinUI.Sample/CourtTimeline.WinUI.Sample.csproj -c Release -p:Platform=x64 -p:UsePackedCourtTimeline=true -p:RestoreAdditionalProjectSources="$((Resolve-Path artifacts).Path)" --nologo
      - name: Publish visual demo with bundled runtimes
        run: dotnet publish samples/CourtTimeline.WinUI.Sample/CourtTimeline.WinUI.Sample.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:UsePackedCourtTimeline=false -o artifacts/demo-win-x64 --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: CourtTimeline-Demo-win-x64
          path: artifacts/demo-win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: CourtTimeline.WinUI
          path: artifacts/*.nupkg
